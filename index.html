    <script>
      (() => {
        const redirectLegacyTvUrl = () => {
          const url = new URL(window.location.href);
          const hasTvQuery = [...url.searchParams.keys()].some((key) =>
            ['tv', 'mode', 'view'].includes(key.toLowerCase()) &&
            (key.toLowerCase() === 'tv' || url.searchParams.get(key)?.toLowerCase() === 'tv')
          );
          const hasTvHash = /^#\/?tv(?:[/?&]|$)/i.test(url.hash);
          if (hasTvQuery || hasTvHash || /\/index\.html$/i.test(url.pathname)) {
            window.location.replace(new URL('./', url).href);
          }
        };
        window.addEventListener('hashchange', redirectLegacyTvUrl);
        redirectLegacyTvUrl();
      })();
    </script>
    <script>
      (() => {
        const nativeSetInterval = window.setInterval.bind(window);
        window.setInterval = (callback, delay, ...args) => {
          try {
            const source = String(callback || '');
            if (delay === 5000 && source.includes('fetchStats') && source.includes('relabel')) {
              return 0;
            }
          } catch {}
          return nativeSetInterval(callback, delay, ...args);
        };
      })();
    </script>
